<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The contract-as-spec maturity model</title>
  <desc id="desc">Six stages of increasing evidence and authority: Output, Traceable source, Explicit claim, Verification, Decision authority, Reusable capability, each advancing along an ascending step diagram.</desc>

  <defs>
    <linearGradient id="stepFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0fb"/>
      <stop offset="100%" stop-color="#dfe3f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>

  <!-- title block -->
  <text x="60" y="72" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="15" letter-spacing="2" fill="#6366f1" font-weight="700">CONTRACT-AS-SPEC</text>
  <text x="60" y="108" font-family="Georgia, 'Iowan Old Style', serif" font-size="34" fill="#0f172a" font-weight="600">From sources to decision authority</text>
  <text x="60" y="136" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#475569">A six-stage maturity model for evidence and authority</text>

  <!-- baseline -->
  <line x1="60" y1="560" x2="1140" y2="560" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 6 ascending steps -->
  <!-- step geometry: x start 60, each column width 176, step height increases -->

  <!-- Step 1: Output -->
  <g>
    <rect x="60" y="470" width="150" height="90" rx="6" fill="url(#stepFill)" stroke="#a5aee8" stroke-width="1.5"/>
    <text x="135" y="450" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6366f1" font-weight="700">01</text>
    <text x="135" y="510" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">Output</text>
    <text x="135" y="532" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">Answer or artifact</text>
  </g>

  <!-- Step 2: Traceable source -->
  <g>
    <rect x="236" y="430" width="150" height="130" rx="6" fill="url(#stepFill)" stroke="#a5aee8" stroke-width="1.5"/>
    <text x="311" y="410" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6366f1" font-weight="700">02</text>
    <text x="311" y="470" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">Traceable</text>
    <text x="311" y="490" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">source</text>
    <text x="311" y="512" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">Points to material</text>
  </g>

  <!-- Step 3: Explicit claim -->
  <g>
    <rect x="412" y="390" width="150" height="170" rx="6" fill="url(#stepFill)" stroke="#a5aee8" stroke-width="1.5"/>
    <text x="487" y="370" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6366f1" font-weight="700">03</text>
    <text x="487" y="430" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">Explicit</text>
    <text x="487" y="450" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">claim</text>
    <text x="487" y="472" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">Claim bound to</text>
    <text x="487" y="488" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">evidence</text>
  </g>

  <!-- Step 4: Verification -->
  <g>
    <rect x="588" y="350" width="150" height="210" rx="6" fill="url(#stepFill)" stroke="#a5aee8" stroke-width="1.5"/>
    <text x="663" y="330" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6366f1" font-weight="700">04</text>
    <text x="663" y="390" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">Verification</text>
    <text x="663" y="412" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">Evidence tested</text>
    <text x="663" y="428" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">against claim</text>
  </g>

  <!-- Step 5: Decision authority -->
  <g>
    <rect x="764" y="300" width="150" height="260" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="839" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6366f1" font-weight="700">05</text>
    <text x="839" y="340" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">Decision</text>
    <text x="839" y="360" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">authority</text>
    <text x="839" y="382" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#3730a3">Named accepter,</text>
    <text x="839" y="398" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#3730a3">not technical proxy</text>
  </g>

  <!-- Step 6: Reusable capability -->
  <g>
    <rect x="940" y="250" width="200" height="310" rx="6" fill="url(#stepFill)" stroke="#a5aee8" stroke-width="1.5"/>
    <text x="1040" y="230" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#6366f1" font-weight="700">06</text>
    <text x="1040" y="290" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">Reusable</text>
    <text x="1040" y="310" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#0f172a" font-weight="600">capability</text>
    <text x="1040" y="332" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">Versioned, discoverable,</text>
    <text x="1040" y="348" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#475569">provenance intact</text>
  </g>

  <!-- ascending connector arrows between step tops -->
  <path d="M210,515 L236,495" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M386,475 L412,455" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M562,435 L588,415" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M738,395 L764,375" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M914,345 L940,325" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- footer note -->
  <text x="60" y="600" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94a3b8">Dimensions advance independently: a workflow need not clear every earlier stage to gain more of a later one.</text>
</svg>
