<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agentic artifact taxonomy</title>
  <desc id="desc">A taxonomy showing instruction, tool, context, governance, execution, and evidence artifacts.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="72" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Agentic artifacts are bigger than skills</text>
  <text x="72" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Any reusable, versionable unit that shapes agent reasoning, action, context, policy, or output belongs in the lifecycle.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(386 162)">
      <rect width="428" height="78" rx="8" fill="#111827"/>
      <text x="214" y="49" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">Agentic Artifacts</text>
    </g>
    <path d="M600 240v48" stroke="#64748b" stroke-width="3"/>
    <path d="M250 288h700" stroke="#64748b" stroke-width="3"/>
    <path d="M250 288v58" stroke="#64748b" stroke-width="3"/>
    <path d="M390 288v58" stroke="#64748b" stroke-width="3"/>
    <path d="M530 288v58" stroke="#64748b" stroke-width="3"/>
    <path d="M670 288v58" stroke="#64748b" stroke-width="3"/>
    <path d="M810 288v58" stroke="#64748b" stroke-width="3"/>
    <path d="M950 288v58" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(116 346)">
      <rect width="268" height="126" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="134" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">Instruction</text>
      <text x="134" y="65" text-anchor="middle" font-size="15" fill="#334155">skills, prompts,</text>
      <text x="134" y="88" text-anchor="middle" font-size="15" fill="#334155">commands, hooks</text>
    </g>
    <g transform="translate(466 346)">
      <rect width="268" height="126" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <text x="134" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#047857">Tool</text>
      <text x="134" y="65" text-anchor="middle" font-size="15" fill="#334155">MCP servers, APIs,</text>
      <text x="134" y="88" text-anchor="middle" font-size="15" fill="#334155">tool declarations</text>
    </g>
    <g transform="translate(816 346)">
      <rect width="268" height="126" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      <text x="134" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">Context</text>
      <text x="134" y="65" text-anchor="middle" font-size="15" fill="#334155">context packs, ADRs,</text>
      <text x="134" y="88" text-anchor="middle" font-size="15" fill="#334155">memory bundles</text>
    </g>
    <g transform="translate(116 536)">
      <rect width="268" height="126" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <text x="134" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#6d28d9">Governance</text>
      <text x="134" y="65" text-anchor="middle" font-size="15" fill="#334155">policies, approvals,</text>
      <text x="134" y="88" text-anchor="middle" font-size="15" fill="#334155">permissions, evals</text>
    </g>
    <g transform="translate(466 536)">
      <rect width="268" height="126" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
      <text x="134" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">Execution</text>
      <text x="134" y="65" text-anchor="middle" font-size="15" fill="#334155">workflows, sessions,</text>
      <text x="134" y="88" text-anchor="middle" font-size="15" fill="#334155">agent definitions</text>
    </g>
    <g transform="translate(816 536)">
      <rect width="268" height="126" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
      <text x="134" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#be123c">Evidence</text>
      <text x="134" y="65" text-anchor="middle" font-size="15" fill="#334155">provenance, outputs,</text>
      <text x="134" y="88" text-anchor="middle" font-size="15" fill="#334155">audit events</text>
    </g>
  </g>
</svg>
