<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">The same estate, ungoverned vs. governed</title>
  <desc id="desc">Side-by-side diptych of the same estate. On the left, two actors (a human and an agent) reach into worktrees across four projects; a tracked skill exists as four scattered, incompatible copies with differing versions and hashes, threaded in red through the tangle. On the right, the same four projects deploy from one SkillMeat registry, each copy verified against the registry by content hash, with drift checked continuously.</desc>
  <rect x="0" y="0" width="1200" height="540" fill="#f8fafc"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="60" y="70" font-size="34" font-weight="700" fill="#0f172a">The Same Estate, Ungoverned vs. Governed</text>
    <text x="60" y="106" font-size="18" fill="#475569">Same projects, same agents. The difference is whether one registry is the authority.</text>

    <path d="M600 124 L600 498" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <text x="60" y="146" font-size="20" font-weight="700" fill="#be123c">UNGOVERNED</text>
    <text x="620" y="146" font-size="20" font-weight="700" fill="#059669">GOVERNED</text>

    <!-- ============ LEFT: no shared authority, actors + worktrees tangled ============ -->

    <!-- worktree branches: project -> worktree dot (actual branching lines, not a label) -->
    <path d="M255 299 Q235 315 220 330" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M305 299 Q325 305 340 315" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M95 253 Q85 260 80 270" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M130 253 Q145 270 150 290" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M280 362 Q265 380 255 395" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M325 362 Q345 366 360 370" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M300 245 Q275 258 260 270" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <path d="M350 245 Q375 250 390 260" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
    <circle cx="220" cy="330" r="4" fill="#94a3b8"/>
    <circle cx="340" cy="315" r="4" fill="#94a3b8"/>
    <circle cx="80" cy="270" r="4" fill="#94a3b8"/>
    <circle cx="150" cy="290" r="4" fill="#94a3b8"/>
    <circle cx="255" cy="395" r="4" fill="#94a3b8"/>
    <circle cx="360" cy="370" r="4" fill="#94a3b8"/>
    <circle cx="260" cy="270" r="4" fill="#94a3b8"/>
    <circle cx="390" cy="260" r="4" fill="#94a3b8"/>

    <!-- actors reaching into worktrees across projects, crossing (drawn under the project chips) -->
    <path d="M90 175 Q120 230 150 290" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M96 172 Q220 250 360 370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M96 172 Q170 200 260 270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M405 136 Q370 220 340 315" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M399 136 Q320 280 255 395" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M399 133 Q240 190 80 270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

    <!-- the ONE tracked artifact: dot -> its scattered copy (paths run UNDER every chip below, so nothing ever crosses text) -->
    <path d="M220 330 Q320 380 417 417" stroke="#be123c" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
    <path d="M80 270 Q120 350 168 425" stroke="#be123c" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
    <path d="M255 395 Q170 370 95 338" stroke="#be123c" stroke-width="2" stroke-dasharray="5 3" fill="none"/>
    <path d="M260 270 Q380 290 506 324" stroke="#be123c" stroke-width="2" stroke-dasharray="5 3" fill="none"/>

    <!-- the thread itself: one artifact, traceable through the tangle -->
    <path d="M95 338 Q300 280 506 324 Q400 400 168 425 Q300 460 417 417" stroke="#be123c" stroke-width="2.5" stroke-dasharray="7 4" fill="none"/>

    <!-- every chip is drawn AFTER all lines above, so a line passing near a chip simply disappears under its opaque fill -->

    <!-- project chips, scattered -->
    <rect x="185" y="271" width="190" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="280" y="290" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">signal_to_system</text>
    <rect x="57" y="225" width="110" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="112" y="244" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">skillmeat</text>
    <rect x="207" y="334" width="190" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="302" y="353" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">agentic_meta_dev</text>
    <rect x="234" y="217" width="180" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="324" y="236" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">spirits-cabinet</text>

    <!-- the four scattered, incompatible copies of the tracked artifact -->
    <rect x="20" y="301" width="150" height="74" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
    <text x="95" y="323" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">voice-writer</text>
    <text x="95" y="343" font-size="15" fill="#be123c" text-anchor="middle">v0.9-stale</text>
    <text x="95" y="361" font-size="15" fill="#64748b" text-anchor="middle">#44b8e6</text>

    <rect x="93" y="388" width="150" height="74" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
    <text x="168" y="410" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">voice-writer</text>
    <text x="168" y="430" font-size="15" fill="#be123c" text-anchor="middle">v1.4-local</text>
    <text x="168" y="448" font-size="15" fill="#64748b" text-anchor="middle">#c4a747</text>

    <rect x="342" y="380" width="150" height="74" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
    <text x="417" y="402" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">voice-writer</text>
    <text x="417" y="422" font-size="15" fill="#be123c" text-anchor="middle">v1.2</text>
    <text x="417" y="440" font-size="15" fill="#64748b" text-anchor="middle">#a1c9f3</text>

    <rect x="431" y="287" width="150" height="74" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
    <text x="506" y="309" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">voice-writer</text>
    <text x="506" y="329" font-size="15" fill="#be123c" text-anchor="middle">v2.0-wip</text>
    <text x="506" y="347" font-size="15" fill="#64748b" text-anchor="middle">#9c4de1</text>

    <!-- actors, drawn last so their markers/labels are never crossed -->
    <circle cx="90" cy="169" r="6" fill="#334155"/>
    <text x="104" y="173" font-size="15" fill="#334155">NICK · LAPTOP</text>
    <rect x="399" y="124" width="12" height="12" fill="#475569"/>
    <text x="417" y="134" font-size="15" fill="#475569">AGENT · ICA</text>

    <!-- ============ RIGHT: registry hub (unchanged structure) ============ -->
    <rect x="740" y="162" width="280" height="60" rx="8" fill="#111827"/>
    <text x="880" y="186" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">SkillMeat Registry</text>
    <text x="880" y="204" font-size="15" fill="#cbd5e1" text-anchor="middle">single authoritative source</text>

    <path d="M880 222 L698 246" stroke="#059669" stroke-width="3" fill="none"/>
    <path d="M692 246 L704 246 L698 260 Z" fill="#059669"/>
    <path d="M880 222 L880 246" stroke="#059669" stroke-width="3" fill="none"/>
    <path d="M874 246 L886 246 L880 260 Z" fill="#059669"/>
    <path d="M880 222 L1062 246" stroke="#059669" stroke-width="3" fill="none"/>
    <path d="M1056 246 L1068 246 L1062 260 Z" fill="#059669"/>
    <text x="898" y="238" font-size="15" fill="#047857">deploy</text>

    <path d="M760 260 L800 236" stroke="#0f766e" stroke-width="3" fill="none"/>
    <path d="M794 236 L806 236 L800 222 Z" fill="#0f766e"/>
    <text x="700" y="238" font-size="15" fill="#0f766e">drift check</text>

    <g>
      <rect x="620" y="260" width="156" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="698" y="284" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">signal_to</text>
      <text x="698" y="304" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">system</text>
      <text x="698" y="326" font-size="15" fill="#64748b" text-anchor="middle">3 worktrees</text>
      <rect x="630" y="350" width="136" height="100" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="698" y="373" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">voice-writer</text>
      <text x="698" y="394" font-size="15" fill="#047857" text-anchor="middle">v1.4</text>
      <text x="698" y="414" font-size="15" fill="#64748b" text-anchor="middle">#71b0d9</text>
      <text x="698" y="434" font-size="15" fill="#047857" text-anchor="middle">✓ hash verified</text>
    </g>
    <g>
      <rect x="802" y="260" width="156" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="880" y="294" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">skillmeat</text>
      <text x="880" y="326" font-size="15" fill="#64748b" text-anchor="middle">3 worktrees</text>
      <rect x="812" y="350" width="136" height="100" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="880" y="373" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">voice-writer</text>
      <text x="880" y="394" font-size="15" fill="#047857" text-anchor="middle">v1.4</text>
      <text x="880" y="414" font-size="15" fill="#64748b" text-anchor="middle">#71b0d9</text>
      <text x="880" y="434" font-size="15" fill="#047857" text-anchor="middle">✓ hash verified</text>
    </g>
    <g>
      <rect x="984" y="260" width="156" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="1062" y="284" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">agentic_meta</text>
      <text x="1062" y="304" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">dev</text>
      <text x="1062" y="326" font-size="15" fill="#64748b" text-anchor="middle">3 worktrees</text>
      <rect x="994" y="350" width="136" height="100" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
      <text x="1062" y="373" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">voice-writer</text>
      <text x="1062" y="394" font-size="15" fill="#047857" text-anchor="middle">v1.4</text>
      <text x="1062" y="414" font-size="15" fill="#64748b" text-anchor="middle">#71b0d9</text>
      <text x="1062" y="434" font-size="15" fill="#047857" text-anchor="middle">✓ hash verified</text>
    </g>

    <text x="305" y="486" font-size="15" fill="#475569" text-anchor="middle">Four projects, two actors, one skill gone four ways.</text>
    <text x="880" y="486" font-size="15" fill="#475569" text-anchor="middle">One canonical version, traceable by content hash.</text>

    <text x="600" y="512" font-size="15" font-style="italic" fill="#64748b" text-anchor="middle">Registry authority, hash verification, and drift detection shown here run today, not aspirational.</text>
  </g>
</svg>
