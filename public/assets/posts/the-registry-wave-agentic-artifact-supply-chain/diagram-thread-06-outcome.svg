<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Thread beat 6: the missing piece is a run record</title>
  <desc id="desc">Closing the loop needs a run record naming which reviewer version an agent session actually loaded, alongside the model, context, and policy state. Runs before that record existed should mark the loaded version unknown rather than assume the current registry state.</desc>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="72" y="70" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">The missing piece is a run record</text>
  <text x="72" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Not "which version is registered now" — which version did this run actually load?</text>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Source repo: muted context -->
    <g transform="translate(60 200)">
      <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" opacity="0.65"/>
      <text x="95" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#334155" opacity="0.75">Source</text>
      <text x="95" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#334155" opacity="0.75">repo</text>
      <text x="95" y="80" text-anchor="middle" font-size="15" fill="#64748b" opacity="0.75">reviewer skill</text>
      <text x="95" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#047857" opacity="0.75">guard: restored</text>
    </g>

    <path d="M252 255h30" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <path d="M294 255l-12-8v16z" fill="#cbd5e1"/>

    <!-- Registry: muted context -->
    <g transform="translate(296 200)">
      <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" opacity="0.65"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#334155" opacity="0.75">Registry</text>
      <text x="95" y="66" text-anchor="middle" font-size="15" fill="#64748b" opacity="0.75">SkillMeat</text>
      <text x="95" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#047857" opacity="0.75">guard: present</text>
    </g>

    <path d="M488 255h30" stroke="#cbd5e1" stroke-width="3" fill="none"/>
    <path d="M530 255l-12-8v16z" fill="#cbd5e1"/>

    <!-- Deployed cluster: de-emphasized, not this beat's focus -->
    <g transform="translate(532 130)">
      <rect width="220" height="300" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <text x="110" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#94a3b8">Deployed copies</text>
      <text x="110" y="50" text-anchor="middle" font-size="15" fill="#cbd5e1">this machine</text>

      <g transform="translate(20 55)">
        <rect width="180" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#94a3b8">Project Alpha</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" fill="#cbd5e1">version: ?</text>
      </g>
      <g transform="translate(20 130)">
        <rect width="180" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#94a3b8">Project Beta</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" fill="#cbd5e1">version: ?</text>
      </g>
      <g transform="translate(20 205)">
        <rect width="180" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#94a3b8">Project Gamma</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" fill="#cbd5e1">version: ?</text>
      </g>
    </g>

    <path d="M754 255h30" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <path d="M796 255l-12-8v16z" fill="#cbd5e1"/>

    <!-- Agent session: active -->
    <g transform="translate(798 200)">
      <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Agent</text>
      <text x="95" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">session</text>
      <text x="95" y="90" text-anchor="middle" font-size="15" fill="#6d28d9">loaded version: ?</text>
    </g>

    <path d="M990 255h30" stroke="#0f766e" stroke-width="3" fill="none"/>
    <path d="M1032 255l-12-8v16z" fill="#0f766e"/>

    <!-- Run record: active, the missing piece -->
    <g transform="translate(1034 200)">
      <rect width="160" height="110" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
      <text x="80" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Run</text>
      <text x="80" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">record</text>
      <text x="80" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">now captured</text>
    </g>

    <!-- Ledger table -->
    <text x="600" y="444" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">What the run record should have said all along</text>

    <rect x="250" y="458" width="700" height="142" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="250" y="458" width="700" height="32" fill="#0f172a"/>
    <g font-size="15" font-weight="700" fill="#ffffff">
      <text x="266" y="478">run_id</text>
      <text x="396" y="478">version loaded</text>
      <text x="626" y="478">guard present</text>
      <text x="776" y="478">outcome</text>
    </g>

    <g font-size="15" fill="#0f172a">
      <text x="266" y="513">run_2041</text>
      <text x="396" y="513" fill="#94a3b8">unknown — not captured</text>
      <text x="626" y="513" fill="#94a3b8">—</text>
      <text x="776" y="513" fill="#64748b">needs re-review</text>
    </g>
    <path d="M250 490h700" stroke="#e2e8f0" stroke-width="1"/>

    <g font-size="15" fill="#0f172a">
      <text x="266" y="549">run_2077</text>
      <text x="396" y="549" fill="#be123c">v2.0, stale (inferred)</text>
      <text x="626" y="549" fill="#be123c">✗</text>
      <text x="776" y="549" fill="#b45309">flagged</text>
    </g>
    <path d="M250 526h700" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="252" y="562" width="696" height="36" fill="#ecfdf5"/>
    <rect x="250" y="562" width="4" height="36" fill="#059669"/>
    <g font-size="15" font-weight="700" fill="#047857">
      <text x="266" y="584">run_2091</text>
      <text x="396" y="584">v2.1-fixed</text>
      <text x="626" y="584">✓</text>
      <text x="776" y="584">accepted</text>
    </g>
    <path d="M250 562h700" stroke="#e2e8f0" stroke-width="1"/>

    <rect x="958" y="568" width="50" height="22" rx="4" fill="#059669"/>
    <text x="983" y="583" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">NEW</text>
  </g>
</svg>
