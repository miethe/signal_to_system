<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Market wave from copied prompts to artifact control planes</title>
  <desc id="desc">A five-step progression showing copied prompts, local skills, skill and MCP registries, governed artifact supply chains, and intent-to-outcome control planes.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="72" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">The market is moving from prompt reuse to governed artifacts</text>
  <text x="72" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Registries are the first visible layer. The durable enterprise layer has to govern artifact lifecycle, execution, and outcomes.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(72 190)">
      <rect width="180" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="90" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Copied</text>
      <text x="90" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">prompts</text>
      <text x="90" y="98" text-anchor="middle" font-size="14" fill="#64748b">useful, brittle</text>
    </g>
    <path d="M270 249h58" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M328 249l-12-8v16z" fill="#64748b"/>
    <g transform="translate(348 190)">
      <rect width="180" height="118" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="90" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Local</text>
      <text x="90" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">skills</text>
      <text x="90" y="98" text-anchor="middle" font-size="14" fill="#2563eb">portable behavior</text>
    </g>
    <path d="M546 249h58" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M604 249l-12-8v16z" fill="#64748b"/>
    <g transform="translate(624 190)">
      <rect width="180" height="118" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <text x="90" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Skill / MCP</text>
      <text x="90" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">registries</text>
      <text x="90" y="98" text-anchor="middle" font-size="14" fill="#059669">discover, install</text>
    </g>
    <path d="M822 249h58" stroke="#64748b" stroke-width="3" fill="none"/>
    <path d="M880 249l-12-8v16z" fill="#64748b"/>
    <g transform="translate(900 190)">
      <rect width="220" height="118" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
      <text x="110" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Governed</text>
      <text x="110" y="64" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">artifact supply</text>
      <text x="110" y="90" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">chain</text>
    </g>
  </g>

  <g transform="translate(338 384)" font-family="Inter, Arial, sans-serif">
    <rect width="524" height="64" rx="8" fill="#eef2ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="262" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#3730a3">intent-to-outcome control plane</text>
  </g>
</svg>
