<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Thread beat 2: same name, different instructions</title>
  <desc id="desc">The registry and the deployed copies carry the same skill name but different bytes: the registry holds the corrected reviewer skill with its guard present, while every deployed copy still runs the pre-fix version with the guard missing.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="72" y="70" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Same name. Different instructions.</text>
  <text x="72" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">The registry and the deployed copies now disagree about what "task-completion-validator" is.</text>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Source repo: correct, secondary emphasis -->
    <g transform="translate(60 200)">
      <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <text x="95" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Source</text>
      <text x="95" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">repo</text>
      <text x="95" y="80" text-anchor="middle" font-size="15" fill="#64748b">reviewer skill</text>
      <text x="95" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">guard: restored</text>
      <circle cx="174" cy="16" r="12" fill="#059669"/>
      <text x="174" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">✓</text>
    </g>

    <path d="M252 255h30" stroke="#059669" stroke-width="3" fill="none"/>
    <path d="M294 255l-12-8v16z" fill="#059669"/>

    <!-- Registry: active, correct -->
    <g transform="translate(296 200)">
      <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="3"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Registry</text>
      <text x="95" y="66" text-anchor="middle" font-size="15" fill="#64748b">SkillMeat</text>
      <text x="95" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">guard: present ✓</text>
      <circle cx="174" cy="16" r="12" fill="#059669"/>
      <text x="174" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">✓</text>
    </g>

    <!-- Divergence badge: relocated clear of the deployed panel (defect fix) -->
    <path d="M488 255h42" stroke="#be123c" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <path d="M490 193v62" stroke="#be123c" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <g transform="translate(490 163)">
      <circle cx="0" cy="0" r="30" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-size="16" font-weight="700" fill="#be123c">same</text>
      <text x="0" y="11" text-anchor="middle" font-size="16" font-weight="700" fill="#be123c">name</text>
    </g>

    <!-- Deployed cluster: active, wrong (rose) -->
    <g transform="translate(532 130)">
      <rect width="220" height="300" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
      <text x="110" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#be123c">Deployed copies</text>
      <text x="110" y="50" text-anchor="middle" font-size="15" fill="#64748b">this machine</text>

      <g transform="translate(20 55)">
        <rect width="180" height="60" rx="6" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Project Alpha</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#be123c">guard: missing ✗</text>
      </g>
      <g transform="translate(20 130)">
        <rect width="180" height="60" rx="6" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Project Beta</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#be123c">guard: missing ✗</text>
      </g>
      <g transform="translate(20 205)">
        <rect width="180" height="60" rx="6" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Project Gamma</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#be123c">guard: missing ✗</text>
      </g>
    </g>

    <path d="M754 255h30" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <path d="M796 255l-12-8v16z" fill="#cbd5e1"/>

    <!-- Agent session: dormant -->
    <g transform="translate(798 200)">
      <rect width="190" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">Agent</text>
      <text x="95" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">session</text>
      <text x="95" y="90" text-anchor="middle" font-size="15" fill="#cbd5e1">not yet in scope</text>
    </g>

    <path d="M990 255h30" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <path d="M1032 255l-12-8v16z" fill="#cbd5e1"/>

    <!-- Run record: dormant -->
    <g transform="translate(1034 200)">
      <rect width="160" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <text x="80" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">Run</text>
      <text x="80" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">record</text>
      <text x="80" y="90" text-anchor="middle" font-size="15" fill="#cbd5e1">not yet in scope</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="296" y="470" width="456" height="56" rx="8" fill="#fef2f2" stroke="#be123c" stroke-width="2"/>
    <text x="524" y="504" text-anchor="middle" font-size="18" font-weight="700" fill="#9f1239">"task-completion-validator" now means two different things</text>
  </g>
</svg>
