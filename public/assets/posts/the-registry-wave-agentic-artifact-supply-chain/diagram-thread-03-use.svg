<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Thread beat 3: presence is not evidence of compliance</title>
  <desc id="desc">An agent session loads the deployed, pre-fix copy of the reviewer skill from Project Alpha. The guard instruction being present in that file is not evidence that the guard was actually followed during the run — that link is unverified.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="72" y="70" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Present is not the same as followed</text>
  <text x="72" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">A run loads the deployed copy. Nothing here says whether its instructions were obeyed.</text>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Source repo: correct, muted -->
    <g transform="translate(60 200)">
      <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <text x="95" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Source</text>
      <text x="95" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">repo</text>
      <text x="95" y="80" text-anchor="middle" font-size="15" fill="#64748b">reviewer skill</text>
      <text x="95" y="99" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">guard: restored</text>
      <circle cx="174" cy="16" r="12" fill="#059669"/>
      <text x="174" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">✓</text>
    </g>

    <path d="M252 255h30" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <path d="M294 255l-12-8v16z" fill="#94a3b8"/>

    <!-- Registry: correct, muted -->
    <g transform="translate(296 200)">
      <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Registry</text>
      <text x="95" y="66" text-anchor="middle" font-size="15" fill="#64748b">SkillMeat</text>
      <text x="95" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">guard: present</text>
      <circle cx="174" cy="16" r="12" fill="#059669"/>
      <text x="174" y="21" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">✓</text>
    </g>

    <path d="M488 255h30" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <path d="M530 255l-12-8v16z" fill="#94a3b8"/>

    <!-- Deployed cluster: Project Alpha active/highlighted, others still stale -->
    <g transform="translate(532 130)">
      <rect width="220" height="300" rx="8" fill="#ffffff" stroke="#be123c" stroke-width="2"/>
      <text x="110" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#be123c">Deployed copies</text>
      <text x="110" y="50" text-anchor="middle" font-size="15" fill="#64748b">this machine</text>

      <g transform="translate(20 55)">
        <rect width="180" height="60" rx="6" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Project Alpha</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#be123c">loaded this run</text>
      </g>
      <g transform="translate(20 130)">
        <rect width="180" height="60" rx="6" fill="#fff1f2" stroke="#be123c" stroke-width="1.5" opacity="0.6"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b" opacity="0.7">Project Beta</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" fill="#be123c" opacity="0.7">guard: missing</text>
      </g>
      <g transform="translate(20 205)">
        <rect width="180" height="60" rx="6" fill="#fff1f2" stroke="#be123c" stroke-width="1.5" opacity="0.6"/>
        <text x="90" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b" opacity="0.7">Project Gamma</text>
        <text x="90" y="44" text-anchor="middle" font-size="15" fill="#be123c" opacity="0.7">guard: missing</text>
      </g>
    </g>

    <path d="M754 255h30" stroke="#7c3aed" stroke-width="3" fill="none"/>
    <path d="M796 255l-12-8v16z" fill="#7c3aed"/>
    <path d="M775 178v70" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <text x="775" y="165" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">loads</text>

    <!-- Agent session: active -->
    <g transform="translate(798 200)">
      <rect width="190" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <text x="95" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Agent</text>
      <text x="95" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">session</text>
      <text x="95" y="90" text-anchor="middle" font-size="15" fill="#6d28d9">Project Alpha's copy</text>
    </g>

    <path d="M990 255h30" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <path d="M1032 255l-12-8v16z" fill="#cbd5e1"/>

    <!-- Run record: dormant, the missing destination -->
    <g transform="translate(1034 200)">
      <rect width="160" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <text x="80" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">Run</text>
      <text x="80" y="66" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">record</text>
      <text x="80" y="90" text-anchor="middle" font-size="15" fill="#cbd5e1">not captured</text>
    </g>

    <!-- The missing-link panel, anchored below the agent session -->
    <path d="M893 310v70" stroke="#94a3b8" stroke-width="2"/>

    <g transform="translate(763 380)">
      <rect width="340" height="56" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="2"/>
      <circle cx="30" cy="28" r="13" fill="#059669"/>
      <text x="30" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">✓</text>
      <text x="55" y="24" font-size="15" font-weight="700" fill="#0f172a">Guard instruction</text>
      <text x="55" y="42" font-size="15" font-weight="700" fill="#047857">present in the file</text>
    </g>

    <path d="M893 436v22" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="915" y="452" font-size="18" font-weight="700" fill="#94a3b8">?</text>

    <g transform="translate(763 470)">
      <rect width="340" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="30" cy="28" r="13" fill="#d97706"/>
      <text x="30" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">?</text>
      <text x="55" y="24" font-size="15" font-weight="700" fill="#0f172a">Guard actually followed</text>
      <text x="55" y="42" font-size="15" font-weight="700" fill="#b45309">unverified this run</text>
    </g>
  </g>
</svg>
