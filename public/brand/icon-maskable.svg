    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3fc9"/>
      <stop offset=".5" stop-color="#c9a8f8"/>
      <stop offset=".86" stop-color="#c9a8f8"/>
      <stop offset="1" stop-color="#9eeedc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="#080914"/>
  <g transform="translate(32 32) scale(.6) translate(-32 -32)">
    <g fill="url(#g)">
      <rect x="12.6" y="25.5" width="2.8" height="13" rx="1.4"/>
      <rect x="18.6" y="19" width="2.8" height="26" rx="1.4"/>
      <rect x="24.6" y="12.5" width="2.8" height="39" rx="1.4"/>
      <rect x="30.6" y="6" width="2.8" height="52" rx="1.4"/>
      <rect x="36.6" y="12.5" width="2.8" height="39" rx="1.4"/>
      <rect x="42.6" y="19" width="2.8" height="26" rx="1.4"/>
      <rect x="48.6" y="25.5" width="2.8" height="13" rx="1.4"/>
    </g>
    <g fill="#8a5ce0">
      <circle cx="8" cy="32" r="1.9"/>
      <circle cx="56" cy="32" r="1.9"/>
    </g>
  </g>
</svg>
