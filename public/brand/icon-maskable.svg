<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Signal to System</title>
  <!-- PNG source, maskable 512: full-bleed tile, mark at 0.6 so it sits inside the 80% safe-zone circle. -->
