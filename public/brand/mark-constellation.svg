<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="s2s-mark-constellation-title">
  <title id="s2s-mark-constellation-title">Signal to System (constellation variant)</title>
  <style>
    .edge { stroke: var(--muted, currentColor); }
    .node { stroke: var(--accent, currentColor); }
    .core { fill: var(--secondary, currentColor); }
  </style>
  <!-- Reserve "network" mark: three linked nodes and one outbound signal. -->
  <path class="edge" d="M17.88 8.78L9.43 19.82M20 9.5v6.3M10.82 21.82l6.12-1.88M22.26 21.26l2.62 2.62" fill="none" stroke-width="1.5" stroke-linecap="round"/>
  <g class="node" fill="none" stroke-width="1.5">
    <circle cx="20" cy="6" r="2.5"/>
    <circle cx="7" cy="23" r="3"/>
    <circle cx="20" cy="19" r="2.2"/>
    <circle cx="27" cy="26" r="2"/>
  </g>
  <g class="core" stroke="none">
    <circle cx="20" cy="6" r="1"/>
    <circle cx="7" cy="23" r="1.2"/>
    <circle cx="27" cy="26" r=".8"/>
  </g>
</svg>
