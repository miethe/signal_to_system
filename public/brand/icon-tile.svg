<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Signal to System</title>
  <!-- PNG source, 192/512 (manifest 'any'): full mark on a rounded tile, as on the board. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3fc9"/>
      <stop offset=".5" stop-color="#c9a8f8"/>
      <stop offset=".86" stop-color="#c9a8f8"/>
      <stop offset="1" stop-color="#9eeedc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-15%" width="160%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feComponentTransfer in="blur" result="halo"><feFuncA type="linear" slope=".75"/></feComponentTransfer>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#080914"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#c9a8f8" stroke-opacity=".22" stroke-width="1"/>
  <g transform="translate(32 32) scale(.78) translate(-32 -32)">
    <g filter="url(#glow)">
    <g fill="url(#g)">
      <rect x="12.6" y="25.5" width="2.8" height="13" rx="1.4"/>
      <rect x="18.6" y="19" width="2.8" height="26" rx="1.4"/>
      <rect x="24.6" y="12.5" width="2.8" height="39" rx="1.4"/>
      <rect x="30.6" y="6" width="2.8" height="52" rx="1.4"/>
      <rect x="36.6" y="12.5" width="2.8" height="39" rx="1.4"/>
      <rect x="42.6" y="19" width="2.8" height="26" rx="1.4"/>
      <rect x="48.6" y="25.5" width="2.8" height="13" rx="1.4"/>
    </g>
    <g fill="#ffffff" fill-opacity=".28">
      <rect x="13.1" y="27" width=".7" height="10"/>
      <rect x="19.1" y="20.5" width=".7" height="23"/>
      <rect x="25.1" y="14" width=".7" height="36"/>
      <rect x="31.1" y="7.5" width=".7" height="49"/>
      <rect x="37.1" y="14" width=".7" height="36"/>
      <rect x="43.1" y="20.5" width=".7" height="23"/>
      <rect x="49.1" y="27" width=".7" height="10"/>
    </g>
    </g>
    <g fill="#8a5ce0">
      <circle cx="8" cy="32" r="1.9"/>
      <circle cx="56" cy="32" r="1.9"/>
    </g>
  </g>
</svg>
