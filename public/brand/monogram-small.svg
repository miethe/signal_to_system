<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="s2s-monogram-small-title">
  <title id="s2s-monogram-small-title">S/S, Signal to System</title>
  <!-- Secondary mark (logo board 05): signal S over system S, split by a diagonal, with a
       four-point sparkle. Small-size cut for 48px and below: a sturdier S (2.6 hairlines)
       so the thin strokes survive rasterization. Hand-drawn once (36 x 52 box), placed twice. -->
