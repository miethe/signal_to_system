    <rect x="7" y="10" width="2" height="12" rx="1"/>
    <rect x="11" y="7" width="2" height="18" rx="1"/>
    <rect x="15" y="4" width="2" height="24" rx="1"/>
    <rect x="19" y="7" width="2" height="18" rx="1"/>
