version: 1
scope: taxonomy and delivery contract; not final visual style
surfaces:
  essay:
    hero: optional one opening
    figure: optional 0-12
    illustration: optional 0-2
    spot: optional
    social-card: required one
  home:
    hero: required one opening
    figure: never
    illustration: optional 0-2
    spot: optional
    social-card: required one
  lab:
    hero: optional one context
    figure: optional 0-6
    illustration: optional 0-1
    spot: optional
    social-card: required one
  projects:
    hero: optional one frontispiece or demo
    figure: optional 0-6
    illustration: optional 0-2
    spot: optional
    social-card: required one
  notebooks:
    hero: optional one scene
    figure: optional 0-4
    illustration: optional 0-1
    spot: optional
    social-card: required one
  studio:
    hero: optional one scene
    figure: optional 0-4
    illustration: optional 0-2
    spot: required or optional marks and icons
    social-card: required one
  series:
    hero: optional one hero
    figure: optional 0-2
    illustration: optional 0-1
    spot: optional
    social-card: required one
schemes:
  signal-dark:
    roles:
      ground: --s2s-canvas; src/styles/tokens/observatory.css:100
      ink: --s2s-ink; src/styles/tokens/observatory.css:109
      accent-1: --s2s-accent; src/styles/tokens/observatory.css:114
      accent-2: --s2s-secondary; src/styles/tokens/observatory.css:119
      accent-3..6: --s2s-viz-3..6; src/styles/tokens/observatory.css:149-152
      muted: --s2s-ink-muted; src/styles/tokens/observatory.css:111
      grid/rule: --s2s-viz-grid; src/styles/tokens/observatory.css:154
      highlight: --s2s-accent-strong; src/styles/tokens/observatory.css:116
      annotation: --s2s-accent-label; src/styles/tokens/observatory.css:118
  paper-light:
    roles:
      ground: TBD by design-language package
      ink: TBD by design-language package
      accent-1: TBD by design-language package
      accent-2: TBD by design-language package
      accent-3..6: TBD by design-language package
      muted: TBD by design-language package
      grid/rule: TBD by design-language package
      highlight: TBD by design-language package
      annotation: TBD by design-language package
default_scheme_by_class:
  hero: signal-dark
  figure: paper-light
  illustration: signal-dark
  spot: signal-dark
  social-card: signal-dark
variant_policy:
  vocabulary:
    - single
    - dark+light pair
  selection:
    - data-theme
    - prefers-color-scheme
    - picture sources
  fallback: canonical single asset must remain legible and cannot omit explanatory information
  naming: slug--class--purpose--scheme.ext; omit scheme for single; append --widthw for derivatives
  defaults:
    hero: single
    figure: single
    illustration: single
    spot: single
    social-card: single
  pair_when: embedded callout meaning or light-context contrast would fail
technical_spec:
  hero:
    ratio: 16:9; 3:2 permitted
    master: 2400x1350
    formats: avif, webp, jpeg source
    grounding: grounded
    safe_area: 35 percent copy-side crop and 8 percent outer
    directory: public/images/surface-or-slug/hero
    max_weight: avif 180KB; webp 260KB
    accessibility: meaningful alt when content-bearing; decorative empty alt; no caption default
  figure:
    ratio: 16:9 or 4:3
    master: 1600x900 or 1600x1200
    formats: svg for vector; png or webp for evidence
    grounding: paper-light default
    safe_area: 6 percent label edge and 10 percent caption clearance
    directory: public/assets/kind/slug
    max_weight: svg 250KB; raster 350KB
    accessibility: alt and caption; credit and long description when applicable
  illustration:
    ratio: 3:2 or 1:1
    master: 1800x1200 or 1600x1600
    formats: avif, webp, svg
    grounding: transparent only when designed to float
    safe_area: 10 percent edge
    directory: public/images/surface-or-slug/illustrations
    max_weight: avif 160KB; webp or svg 240KB
    accessibility: meaningful alt when conceptual; optional caption
  spot:
    ratio: 1:1, 3:2, or natural
    master: 512x512 maximum
    formats: svg preferred; avif or webp
    grounding: transparent
    safe_area: 8 percent visual breathing room
    directory: src/assets/icons, src/assets/ornaments, or public/images spots
    max_weight: svg 30KB; raster 60KB
    accessibility: decorative empty alt or aria-hidden; functional control owns label
  social-card:
    ratio: 1.91:1
    master: 2400x1260; render 1200x630
    formats: png
    grounding: grounded
    safe_area: 10 percent edge; title central 70 percent
    directory: generated og/family/slug.png or public/og
    max_weight: png 350KB
    accessibility: metadata title and description; not content image
