version: 3
pack: essay-storyboards-v1
revision: opus-taste-pass-2026-09-23
style_reference: 00-style-reference.md
standards_reference: docs/design/imagery/graphics-standards-v1.yaml

# status vocabulary:
#   replace-existing     replaces a named legacy asset in an existing Figure/hero slot
#   required-net-new     new asset required by the standards (hero night twins, social art)
#   optional-net-new     additive; not a publishing blocker
#   existing-exemplar    reference only; do NOT regenerate
# priority: 1 = heroes (both halves), 2 = core plates, 3 = second-wave plates, 4 = optional
# pairs: a hero listed as "dark+light pair" is two renders; the signal-dark half is an EDIT of the approved paper-light half.
dependencies:
  - id: og-per-post-art
    what: src/lib/og/render.ts loads one fixed image (:118); later work must resolve a per-post art path with fallback while preserving live title composition; social assets are art-only
    blocks: [aof-social, pp-social, contract-social, rw-social]
  - id: mdx-renumber
    what: agentic-operations-flow Figures 01-02 are cut and 03-07 renumber to 01-05; new Figures added in the-contract-is-the-work
    blocks: landing only, not generation

