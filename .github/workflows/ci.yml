name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type check (astro check)
        run: npm run check
      - name: M0 safety and route regression harness
        run: npm run test:m0 && npm run test:routes && npm run check:links
      - name: Editorial gate (em dash check)
        run: npm run check:prose
      - name: Lint
        run: echo "Lint step placeholder — configure eslint/prettier as needed"
